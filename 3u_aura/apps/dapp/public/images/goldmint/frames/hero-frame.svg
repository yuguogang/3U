      <stop offset="0" stop-color="#8f5d23"/>
      <stop offset="0.12" stop-color="#fdeeb8"/>
      <stop offset="0.28" stop-color="#d39b3e"/>
      <stop offset="0.48" stop-color="#fff4c7"/>
      <stop offset="0.74" stop-color="#b47c2d"/>
      <stop offset="1" stop-color="#7a4d1c"/>
