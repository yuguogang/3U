  </defs>
  <rect x="0" y="0" width="1000" height="360" fill="url(#ivory-band)" mask="url(#ivory-band-mask)"/>
  <rect x="0" y="0" width="1000" height="360" fill="url(#ivory-core-lip)" mask="url(#ivory-lip-mask)"/>
  <rect x="0" y="0" width="1000" height="360" fill="url(#ivory-top-glow)" mask="url(#ivory-band-mask)"/>
  <rect x="0" y="0" width="1000" height="360" fill="url(#ivory-bottom-weight)" mask="url(#ivory-band-mask)"/>
  <rect x="60" y="56" width="880" height="248" rx="34" stroke="#f0d7a0" stroke-opacity="0.26" stroke-width="1.5"/>
