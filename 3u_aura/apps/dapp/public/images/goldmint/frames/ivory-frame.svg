<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="none" fill="none">
  <defs>
    <linearGradient id="ivory-band" x1="30" y1="24" x2="970" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8c5d26"/>
      <stop offset="0.14" stop-color="#f7e2a7"/>
      <stop offset="0.34" stop-color="#c58d37"/>
      <stop offset="0.56" stop-color="#fff1cb"/>
      <stop offset="0.82" stop-color="#a56f2b"/>
      <stop offset="1" stop-color="#744b20"/>
    </linearGradient>
    <linearGradient id="ivory-core-lip" x1="500" y1="34" x2="500" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8" stop-opacity="0.98"/>
      <stop offset="0.48" stop-color="#fff7e7" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#efd8a3" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ivory-top-glow" x1="500" y1="18" x2="500" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ivory-bottom-weight" x1="500" y1="244" x2="500" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a6b2f" stop-opacity="0"/>
