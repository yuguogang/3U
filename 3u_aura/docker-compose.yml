services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: aura_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: 3u_aura
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - aura_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存与队列
  redis:
    image: redis:7-alpine
    container_name: aura_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aura_network

  # PGAdmin (数据库可视化管理)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aura_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@3uaura.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - aura_network
    restart: unless-stopped
    depends_on:
      - postgres

  # Redis Commander (Redis可视化管理)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: aura_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aura_network

volumes:
  redis_data:
    driver: local
  postgres_data:
  pgadmin_data:


networks:
  aura_network:
    driver: bridge
